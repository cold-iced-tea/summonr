# Drill for bughunt-gather: pure, no model. Run through ./drill.sh.
drill: bughunt-gather-cases
ritual: bughunt-gather
cases:
  - id: same-spot-from-two-angles-collapses
    inputs:
      min_batch: 1
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.9, claim: first, trigger: t, snippet: x(), file: src/a.rs, start: 0, quoted: true}
        - angle: b
          findings:
            - {kind: bug, severity: high, confidence: 0.8, claim: second, trigger: t, snippet: x(), file: src/a.rs, start: 0, quoted: true}
            - {kind: bypass, severity: low, confidence: 0.8, claim: other, trigger: t, snippet: x(), file: src/a.rs, start: 0, quoted: true}
    expect:
      outcome: returned
      result: {count: 2, pass: true}
      model_calls: 0
  - id: low-confidence-dropped
    inputs:
      min_batch: 1
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.1, claim: weak, trigger: t, snippet: y(), file: src/a.rs, start: 0, quoted: true}
    expect:
      outcome: returned
      result: {count: 0, findings: [], pass: false}
  - id: custom-min-confidence-param
    inputs:
      min_batch: 1
      min_confidence: 0.85
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.8, claim: below floor, trigger: t, snippet: a(), file: src/a.rs, start: 0, quoted: true}
            - {kind: bug, severity: high, confidence: 0.9, claim: above floor, trigger: t, snippet: b(), file: src/a.rs, start: 0, quoted: true}
    expect:
      outcome: returned
      result: {count: 1, pass: true}
  - id: small-batch-does-not-pass
    inputs:
      min_batch: 3
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.9, claim: c, trigger: t, snippet: z(), file: src/a.rs, start: 0, quoted: true}
    expect:
      outcome: returned
      result: {count: 1, min_batch: 3, pass: false}
  - id: no-hunts-at-all
    inputs: {hunts: []}
    expect:
      outcome: returned
      result: {count: 0, pass: false}
  - id: unquoted-snippet-dropped
    inputs:
      min_batch: 1
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.9, claim: made up, trigger: t, snippet: "{ ... }", file: src/a.rs, start: 0, quoted: false}
    expect:
      outcome: returned
      result: {count: 0, findings: [], pass: false}
  - id: angle-echo-and-no-bug-claims-dropped
    inputs:
      min_batch: 1
      hunts:
        - angle: a
          findings:
            - {kind: bug, severity: high, confidence: 0.95, claim: "Untrusted text reaching a path, command, header, query or prompt", trigger: t, snippet: "let a = 1;", file: src/a.rs, start: 0, quoted: true}
            - {kind: bug, severity: high, confidence: 0.90, claim: "The code does not panic on hostile input", trigger: t, snippet: "let b = 2;", file: src/a.rs, start: 0, quoted: true}
            - {kind: bug, severity: low, confidence: 0.95, claim: "The code does not have a vulnerability where untrusted text reaches a path.", trigger: t, snippet: "let c = 3;", file: src/a.rs, start: 0, quoted: true}
            - {kind: bug, severity: high, confidence: 0.90, claim: "Division by zero when n == 0", trigger: "n = 0", snippet: "let d = x / n;", file: src/a.rs, start: 0, quoted: true}
    expect:
      outcome: returned
      result: {count: 1, pass: true}
