language_version: 1
ritual: bughunt-scan-file
description: >-
  Read one source file chunk by chunk and ask a small model for bugs or ways
  around the system from one angle. Returns only findings, so file text never
  leaves this summon (loop results that carry it exceed the 1 MiB data limit).
inputs:
  path: string
  angle: string
  # Chunks that start after this line are test code and are not scanned
  # (Rust convention). Empty string scans everything.
  stop_at: {type: string, default: "mod tests {"}
  chunk: {type: integer, default: 150, min: 1, max: 2000}
  # No range operation exists, so chunk starts are listed; starts past the
  # end of a file are skipped. Covers files up to 4,500 lines at chunk 150.
  starts:
    type: list
    default: [0, 150, 300, 450, 600, 750, 900, 1050, 1200, 1350, 1500, 1650, 1800, 1950, 2100, 2250, 2400, 2550, 2700, 2850, 3000, 3150, 3300, 3450, 3600, 3750, 3900, 4050, 4200, 4350]
model: ollama/qwen3:4b
# num_predict caps a runaway answer so it fails fast instead of looping.
settings: {temperature: 0, num_ctx: 16384, num_predict: 2048}
requires:
  - {reagent: file, action: read_text, on: {root: /absolute/path/to/target}}
essence: {requests: 40, time: 30m}
defs:
  finding:
    type: object
    required: [kind, severity, confidence, claim, trigger, snippet]
    additionalProperties: false
    properties:
      kind: {type: string, enum: [bug, bypass]}
      severity: {type: string, enum: [low, medium, high, critical]}
      confidence: {type: number, minimum: 0, maximum: 1}
      claim: {type: string, maxLength: 300}
      trigger: {type: string, maxLength: 300}
      snippet: {type: string, maxLength: 200}
steps:
  - id: source
    operation: file.read_text
    arguments: {root: /absolute/path/to/target, path: "${inputs.path}"}
  - id: lines
    operation: data.lines
    arguments: {text: "${steps.source.output.text}"}
  - id: line_count
    operation: data.count
    arguments: {value: "${steps.lines.output}"}
  # Where the test module starts, found once: the code is everything before
  # the first line starting with stop_at. (No index_of exists, so split.)
  - id: has_stop
    operation: data.compare
    arguments: {left: "${inputs.stop_at}", right: "", operator: ne}
  - id: separator
    operation: data.select
    arguments: {condition: "${steps.has_stop.output}", then: "\n${inputs.stop_at}", else: "\n\0no stop line"}
  - id: parts
    operation: data.split
    arguments: {text: "${steps.source.output.text}", separator: "${steps.separator.output}"}
  - id: code
    operation: data.get
    arguments: {value: "${steps.parts.output}", path: /0}
  - id: code_line_list
    operation: data.lines
    arguments: {text: "${steps.code.output}"}
  - id: code_lines
    operation: data.count
    arguments: {value: "${steps.code_line_list.output}"}
  # A chunk the model chokes on (invalid JSON, runaway repetition)
  # is recorded and skipped, not fatal to the whole hunt.
  - id: per_chunk
    each: start in inputs.starts
    on_failure: continue
    steps:
      - id: in_file
        operation: data.compare
        arguments: {left: "${start}", right: "${steps.code_lines.output}", operator: lt}
      - if: steps.in_file.output
        then:
          - id: stop_raw
            operation: data.arithmetic
            arguments: {left: "${start}", right: "${inputs.chunk}", operator: add}
          - id: stop
            operation: data.clamp
            arguments: {value: "${steps.stop_raw.output}", min: 0, max: "${steps.line_count.output}"}
          - id: window
            operation: data.slice
            arguments: {values: "${steps.lines.output}", start: "${start}", end: "${steps.stop.output}"}
          - id: text
            operation: data.join
            arguments: {values: "${steps.window.output}", separator: "\n"}
          - id: scan
            model:
              instructions: |
                You are a careful security and correctness reviewer.
                Look only for problems matching the angle you are given.
                Report only problems you can point to in the code shown.
                For each one give: kind (bug, or bypass for a way around a
                permission or limit), severity, your confidence from 0 to 1,
                the claim in one sentence, an input or sequence that
                triggers it, and snippet: one line copied exactly from the
                code. If you find nothing, return an empty list.
              prompt: |
                Angle: ${inputs.angle}
                File: ${inputs.path} (lines from ${start})

                ${steps.text.output}
              schema:
                type: object
                required: [findings]
                additionalProperties: false
                properties:
                  findings: {type: array, maxItems: 8, items: {$ref: "#/$defs/finding"}}
          - id: per_finding
            each: found in steps.scan.output.findings
            steps:
              # Deterministic check: was the snippet really copied from this chunk?
              - id: needle
                operation: data.trim
                arguments: {text: "${found.snippet}"}
              - id: appears
                operation: data.contains
                arguments: {value: "${steps.text.output}", needle: "${steps.needle.output}"}
              # A quote under 8 characters (`}`, `{`) locates nothing.
              - id: needle_len
                operation: data.count
                arguments: {value: "${steps.needle.output}"}
              - id: long_enough
                operation: data.compare
                arguments: {left: "${steps.needle_len.output}", right: 8, operator: ge}
              - id: quoted
                operation: data.logic
                arguments: {operator: and, left: "${steps.appears.output}", right: "${steps.long_enough.output}"}
              - id: placed
                operation: data.merge
                arguments:
                  left: "${found}"
                  right: {file: "${inputs.path}", start: "${start}", quoted: "${steps.quoted.output}"}
          - id: chunk_findings
            operation: data.fold
            arguments:
              values: "${steps.per_finding.output}"
              initial: []
              operation: data.concat
              arguments: {left: "${acc}", right: ["${item.outputs.placed}"]}
      - id: chunk_out
        operation: data.select
        arguments:
          condition: "${steps.in_file.output}"
          then: "${steps.chunk_findings.output}"
          else: []
  - id: chunks_ok
    operation: data.filter
    arguments: {values: "${steps.per_chunk.output}", predicate: 'item.status == "returned"'}
  - id: file_findings
    operation: data.fold
    arguments:
      values: "${steps.chunks_ok.output}"
      initial: []
      operation: data.concat
      arguments: {left: "${acc}", right: "${item.outputs.chunk_out}"}
  # Count chunks that were attempted and chunks that failed. A file whose
  # every chunk failed is a failure, not "no findings": usually the model
  # or backend is down.
  - id: chunks_failed_list
    operation: data.filter
    arguments: {values: "${steps.per_chunk.output}", predicate: 'item.status != "returned"'}
  - id: chunks_failed
    operation: data.count
    arguments: {value: "${steps.chunks_failed_list.output}"}
  - id: chunks_tried_list
    operation: data.filter
    arguments: {values: "${steps.per_chunk.output}", predicate: 'item.status != "returned" or item.outputs.in_file'}
  - id: chunks_tried
    operation: data.count
    arguments: {value: "${steps.chunks_tried_list.output}"}
  - id: tried_some
    operation: data.compare
    arguments: {left: "${steps.chunks_tried.output}", right: 0, operator: gt}
  - id: all_failed
    operation: data.compare
    arguments: {left: "${steps.chunks_failed.output}", right: "${steps.chunks_tried.output}", operator: eq}
  - id: dead
    operation: data.logic
    arguments: {operator: and, left: "${steps.tried_some.output}", right: "${steps.all_failed.output}"}
  - id: alive
    operation: data.logic
    arguments: {operator: not, left: "${steps.dead.output}"}
  - id: some_chunk_worked
    operation: data.assert
    arguments: {condition: "${steps.alive.output}", message: "every chunk of ${inputs.path} failed; is the model or backend available?"}
return:
  findings: "${steps.file_findings.output}"
  chunks_failed: "${steps.chunks_failed.output}"
