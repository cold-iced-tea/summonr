language_version: 1
ritual: bughunt-gather
description: >-
  Merge the findings of several hunts, drop unquoted, low-confidence, low-severity,
  and degenerate noise claims (angle echoes and no-bug statements) using pure
  expression string helpers, dedupe by (file, kind, snippet), and say whether
  the batch is big enough to test. Pure: no model, no files.
inputs:
  hunts: list
  min_batch: {type: integer, default: 5, min: 1, max: 1000}
  min_confidence: {type: number, default: 0.3, min: 0, max: 1}
  min_severity: {type: string, default: low, enum: [low, medium, high, critical]}
essence: {requests: 0, time: 30m}
steps:
  - id: hunt_lists
    operation: data.map
    arguments:
      values: "${inputs.hunts}"
      operation: data.get
      arguments: {value: "${item}", path: /findings}
  - id: all
    operation: data.flatten
    arguments: {values: "${steps.hunt_lists.output}"}
  # Filter quoted, confident, severity-qualified, non-noise findings in one pass.
  - id: clean
    operation: data.filter
    arguments:
      values: "${steps.all.output}"
      predicate: >-
        item.quoted
        and item.confidence >= params.floor
        and (
          params.min_sev == "low"
          or (params.min_sev == "medium" and item.severity != "low")
          or (params.min_sev == "high" and (item.severity == "high" or item.severity == "critical"))
          or (params.min_sev == "critical" and item.severity == "critical")
        )
        and not contains(lower(trim(item.claim)), "does not panic")
        and not contains(lower(trim(item.claim)), "does not have a vulnerability")
        and not contains(lower(trim(item.claim)), "no vulnerability")
        and not contains(lower(trim(item.claim)), "no bug")
        and not starts_with(lower(trim(item.claim)), "untrusted text reaching a path")
        and not starts_with(lower(trim(item.claim)), "panics, overflows or unbounded work")
        and not starts_with(lower(trim(item.claim)), "ways to bypass a permission")
      params:
        floor: "${inputs.min_confidence}"
        min_sev: "${inputs.min_severity}"
  - id: findings
    operation: data.unique_by
    arguments: {values: "${steps.clean.output}", fields: [file, kind, snippet]}
  - id: count
    operation: data.count
    arguments: {value: "${steps.findings.output}"}
  - id: pass
    operation: data.compare
    arguments: {left: "${steps.count.output}", right: "${inputs.min_batch}", operator: ge}
return:
  findings: "${steps.findings.output}"
  count: "${steps.count.output}"
  min_batch: "${inputs.min_batch}"
  pass: "${steps.pass.output}"
