language_version: 1
ritual: bughunt-bench
description: >-
  Run one hunt per angle and score their findings together against a gold
  set in the lab's benchmark folder, then report recall and noise. Large inputs never cross the command
  line: the gold set is read from a file.
inputs:
  root: {type: string, default: /absolute/path/to/target}
  benchmark_root: {type: string, default: /absolute/path/to/lab/benchmark}
  dirs: {type: list, default: [src]}
  angles: list
  gold: {type: string, default: gold.json}
requires:
  - {reagent: file, action: walk, on: {root: "${inputs.root}"}}
  - {reagent: file, action: read_text, on: {root: "${inputs.root}"}}
  - {reagent: file, action: read_json, on: {root: "${inputs.benchmark_root}"}}
essence: {requests: 1500, time: 6h}
steps:
  - id: gold
    operation: file.read_json
    arguments: {root: "${inputs.benchmark_root}", path: "${inputs.gold}"}
  - id: per_angle
    each: angle in inputs.angles
    on_failure: continue
    steps:
      - id: hunt
        ritual: bughunt-hunt
        arguments: {root: "${inputs.root}", dirs: "${inputs.dirs}", angle: "${angle}"}
  - id: hunts_ok
    operation: data.filter
    arguments: {values: "${steps.per_angle.output}", predicate: 'item.status == "returned"'}
  - id: hunts_failed_list
    operation: data.filter
    arguments: {values: "${steps.per_angle.output}", predicate: 'item.status != "returned"'}
  - id: hunts_failed
    operation: data.count
    arguments: {value: "${steps.hunts_failed_list.output}"}
  - id: hunts
    operation: data.fold
    arguments:
      values: "${steps.hunts_ok.output}"
      initial: []
      operation: data.concat
      arguments: {left: "${acc}", right: ["${item.outputs.hunt}"]}
  - id: all_findings
    operation: data.fold
    arguments:
      values: "${steps.hunts.output}"
      initial: []
      operation: data.concat
      arguments: {left: "${acc}", right: "${item.findings}"}
  - id: kept
    ritual: bughunt-gather
    arguments: {hunts: "${steps.hunts.output}", min_batch: 1}
  - id: raw
    ritual: bughunt-score
    arguments: {findings: "${steps.all_findings.output}", gold: "${steps.gold.output.value}"}
  - id: filtered
    ritual: bughunt-score
    arguments: {findings: "${steps.kept.output.findings}", gold: "${steps.gold.output.value}"}
return:
  angles: "${inputs.angles}"
  hunts_failed: "${steps.hunts_failed.output}"
  hunts: "${steps.hunts.output}"
  raw: "${steps.raw.output}"
  after_gather: "${steps.filtered.output}"
  findings: "${steps.kept.output.findings}"
