language_version: 1
ritual: bughunt-test
description: >-
  Try to prove each finding: optional cross-file triage reads the file's top
  imports/types and up to one referenced sibling file so multi-file bugs and
  wrong hunter claims are re-diagnosed accurately; then a model writes a Rust
  test module that panics with BUGHUNT-CONFIRMED only if the bug is real,
  trial runs it in a throwaway worktree, and the result becomes confirmed,
  refuted, dismissed, or untestable. One retry with the compiler output when
  the first test does not build. Worktree cleanup always runs in finally:.
inputs:
  findings: list
  chunk: {type: integer, default: 240, min: 1, max: 2000}
  escalate: {type: string, enum: [none, codex, gemini], default: none}
  # When true (default), findings are re-diagnosed by the 35B model on a wider
  # code window (with file header + optional sibling file) before writing a
  # test; false positives are dismissed without spending build budget.
  triage: {type: boolean, default: true}
  # When true and escalate != none, run free local triage first and only send
  # surviving real_bug leads to the cloud test writer.
  escalate_after_triage: {type: boolean, default: false}
  # Each finding costs one to four model calls and up to two builds; the
  # rest are reported as untested rather than left to exhaust the run.
  max_batch: {type: integer, default: 25, min: 1, max: 200}
model: ollama/qwen3:4b
# Explicit num_predict prevents reasoning models (Qwen3.6-35B-A3B) from
# truncating before emitting JSON.
settings: {temperature: 0, num_ctx: 16384, num_predict: 6144}
requires:
  - {reagent: file, action: read_text, on: {root: /absolute/path/to/target}}
  - {reagent: file, action: write_text, on: {root: /absolute/path/to/target-repro}}
  - {reagent: git, action: worktree_add}
  - {reagent: git, action: remove_worktree}
  - {reagent: git, action: delete_branch}
  - {reagent: trial, action: run}
  - {reagent: cmd, action: read}
essence: {requests: 200, time: 4h, cleanup_time: 1m}
defs:
  context_req:
    type: object
    required: [needs_file, symbol]
    additionalProperties: false
    properties:
      needs_file: {type: string, maxLength: 200}
      symbol: {type: string, maxLength: 120}
  triage_verdict:
    type: object
    required: [real_bug, diagnosis, target_fn, test_strategy]
    additionalProperties: false
    properties:
      real_bug: {type: boolean}
      diagnosis: {type: string, maxLength: 500}
      target_fn: {type: string, maxLength: 120}
      test_strategy: {type: string, maxLength: 500}
  repro:
    type: object
    required: [rust_source]
    additionalProperties: false
    properties:
      rust_source: {type: string, minLength: 20, maxLength: 20000}
bindings:
  context_guide:
    content: |
      You are preparing context to audit a suspected bug in one Rust file.
      Decide whether understanding the bug (or checking a cross-file security
      or logic interaction, caller, callee, or type definition) requires
      reading ONE other source file in this repository.
      - If the code shown is self-contained, return {"needs_file": "", "symbol": ""}.
      - If another repo file is needed, return its repo-relative path in
        needs_file (for example "src/exec.rs") and a short function or type
        name to center on in symbol (or "" for the top of the file).
      Answer with JSON matching the schema.
  triage_guide:
    content: |
      You are a senior Rust security and correctness reviewer triaging a lead
      from an automated scanner. The scanner often lands on the right
      function while getting the root cause wrong — or flags completely safe
      code. Do NOT stop just because the scanner's claim is wrong: first
      independently audit the Rust code shown (including any sibling file
      context provided) for ANY real security bypass, injection, panic,
      overflow, or logic bug before deciding it is safe.
      - Only if the code shown is genuinely sound, set real_bug: false and
        explain briefly why it is safe.
      - If there IS a real bug or bypass in the code shown (even if the real
        bug differs completely from the scanner's claim!), set real_bug: true,
        state the exact root cause in diagnosis, name the reachable Rust
        function in target_fn, and give a concrete unit-test plan in
        test_strategy.
      Answer with JSON matching the schema.
  harness:
    content: |
      You write one Rust test that proves or disproves a suspected bug.
      Your file becomes src/bughunt_repro.rs, a #[cfg(test)] module declared
      at the crate root, so reach code with crate:: paths (for
      src/reagents/file_reagent.rs that is crate::reagents::file_reagent).
      Private items are reachable only if their module and the item are
      visible to the crate; prefer pub(crate) functions you can see. If the
      suspect function is private (`fn`, not `pub`), do NOT copy it into
      `bughunt_repro.rs`; call the `pub` or `pub(crate)` entry point in the
      same module that reaches it.
      Write the complete file: use lines, then exactly one #[test] function.
      The test must panic with a message starting BUGHUNT-CONFIRMED ONLY at
      the single final assertion when the bug really happens, for example:
        assert!(!bad, "BUGHUNT-CONFIRMED: <what happened>");
      Never place BUGHUNT-CONFIRMED in more than one branch or on setup/parse
      assertions (use .expect("setup") for fixture setup). Keep the marker
      message to one short line (under 80 characters, no {:?} dumps). If the
      code behaves correctly the test must pass.
      Never use #[should_panic]; to check for a panic, wrap the call in
      std::panic::catch_unwind and assert `result.is_ok()` with the marker
      (NEVER `assert!(result.is_err(), "BUGHUNT-CONFIRMED...")`, which inverts
      the check and falsely fires when no panic occurred).
      Write any files only under std::env::temp_dir(). Use only the
      standard library and crates the project already uses. No network.
      You must call the real code under suspicion; a test that copies the
      logic into itself proves nothing and is rejected.
      Answer with JSON: {"rust_source": "<the whole Rust file, as code>"}.
steps:
  - id: add
    operation: git.worktree_add
    arguments: {repo: bughunt-target, branch: repro}
  - id: n_findings
    operation: data.count
    arguments: {value: "${inputs.findings}"}
  - id: batch_end
    operation: data.clamp
    arguments: {value: "${inputs.max_batch}", min: 0, max: "${steps.n_findings.output}"}
  - id: batch
    operation: data.slice
    arguments: {values: "${inputs.findings}", start: 0, end: "${steps.batch_end.output}"}
  - id: untested
    operation: data.arithmetic
    arguments: {left: "${steps.n_findings.output}", right: "${steps.batch_end.output}", operator: subtract}
  - id: per_finding
    each: found in steps.batch.output
    on_failure: continue
    keep: [result]
    steps:
      - id: source
        operation: file.read_text
        arguments: {root: /absolute/path/to/target, path: "${found.file}"}
      - id: lines
        operation: data.lines
        arguments: {text: "${steps.source.output.text}"}
      - id: line_count
        operation: data.count
        arguments: {value: "${steps.lines.output}"}
      # Start 40 lines before found.start so function signatures are visible,
      # and also include the top 60 lines (imports & types) when win_start > 0.
      - id: win_start_raw
        operation: data.arithmetic
        arguments: {left: "${found.start}", right: 40, operator: subtract}
      - id: win_start
        operation: data.clamp
        arguments: {value: "${steps.win_start_raw.output}", min: 0, max: "${steps.line_count.output}"}
      - id: stop_raw
        operation: data.arithmetic
        arguments: {left: "${steps.win_start.output}", right: "${inputs.chunk}", operator: add}
      - id: stop
        operation: data.clamp
        arguments: {value: "${steps.stop_raw.output}", min: 0, max: "${steps.line_count.output}"}
      - id: window
        operation: data.slice
        arguments: {values: "${steps.lines.output}", start: "${steps.win_start.output}", end: "${steps.stop.output}"}
      - id: code
        operation: data.join
        arguments: {values: "${steps.window.output}", separator: "\n"}
      - id: hdr_end
        operation: data.clamp
        arguments: {value: 60, min: 0, max: "${steps.line_count.output}"}
      - id: hdr_slice
        operation: data.slice
        arguments: {values: "${steps.lines.output}", start: 0, end: "${steps.hdr_end.output}"}
      - id: hdr_joined
        operation: data.join
        arguments: {values: "${steps.hdr_slice.output}", separator: "\n"}
      - id: need_hdr
        operation: data.compare
        arguments: {left: "${steps.win_start.output}", right: 0, operator: gt}
      - id: header_block
        operation: data.select
        arguments:
          condition: "${steps.need_hdr.output}"
          then: "File header (${found.file}, lines 0..${steps.hdr_end.output}):\n${steps.hdr_joined.output}\n\n"
          else: ""
      - id: is_big
        operation: data.contains
        arguments: {value: [high, critical], needle: "${found.severity}"}
      - id: is_critical
        operation: data.compare
        arguments: {left: "${found.severity}", right: critical, operator: eq}
      - id: wants_codex
        operation: data.compare
        arguments: {left: "${inputs.escalate}", right: codex, operator: eq}
      - id: use_codex
        operation: data.logic
        arguments: {operator: and, left: "${steps.wants_codex.output}", right: "${steps.is_critical.output}"}
      - id: wants_gemini
        operation: data.compare
        arguments: {left: "${inputs.escalate}", right: gemini, operator: eq}
      - id: use_gemini
        operation: data.logic
        arguments: {operator: and, left: "${steps.wants_gemini.output}", right: "${steps.is_critical.output}"}
      - id: use_cloud
        operation: data.logic
        arguments: {operator: or, left: "${steps.use_codex.output}", right: "${steps.use_gemini.output}"}
      - id: not_cloud
        operation: data.logic
        arguments: {operator: not, left: "${steps.use_cloud.output}"}
      - id: triage_for_cloud
        operation: data.logic
        arguments: {operator: and, left: "${steps.use_cloud.output}", right: "${inputs.escalate_after_triage}"}
      - id: triage_eligible
        operation: data.logic
        arguments: {operator: or, left: "${steps.not_cloud.output}", right: "${steps.triage_for_cloud.output}"}
      - id: run_triage
        operation: data.logic
        arguments: {operator: and, left: "${inputs.triage}", right: "${steps.triage_eligible.output}"}
      - id: brief
        operation: data.canonical_json
        arguments: {value: "${found}"}
      # Step 1 of triage: optionally fetch ONE referenced sibling file for
      # cross-file bug context (safe fallback if the model names a bad path).
      - if: steps.run_triage.output
        then:
          - id: triage_context
            model:
              name: ollama/hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
              bind: [context_guide]
              prompt: |
                Scanner lead: ${steps.brief.output}

                ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                ${steps.code.output}
              schema: {$ref: "#/$defs/context_req"}
          - id: req_file
            operation: data.trim
            arguments: {text: "${steps.triage_context.output.needs_file}"}
          - id: req_sym
            operation: data.trim
            arguments: {text: "${steps.triage_context.output.symbol}"}
          - id: has_req_file
            operation: data.compare
            arguments: {left: "${steps.req_file.output}", right: "", operator: ne}
          - id: is_other_file
            operation: data.compare
            arguments: {left: "${steps.req_file.output}", right: "${found.file}", operator: ne}
          - id: fetch_sibling
            operation: data.logic
            arguments: {operator: and, left: "${steps.has_req_file.output}", right: "${steps.is_other_file.output}"}
          - if: steps.fetch_sibling.output
            then:
              - id: sib_raw
                operation: file.read_text
                arguments: {root: /absolute/path/to/target, path: "${steps.req_file.output}"}
                fallback:
                  - id: sib_missing
                    operation: data.select
                    arguments: {condition: true, then: {text: ""}, else: {text: ""}}
              - id: sib_text
                operation: data.get
                arguments: {value: "${steps.sib_raw.output}", path: /text, default: ""}
              - id: sib_lines
                operation: data.lines
                arguments: {text: "${steps.sib_text.output}"}
              - id: sib_count
                operation: data.count
                arguments: {value: "${steps.sib_lines.output}"}
              - id: has_sym
                operation: data.compare
                arguments: {left: "${steps.req_sym.output}", right: "", operator: ne}
              - if: steps.has_sym.output
                then:
                  - id: sym_idx
                    operation: data.index_of
                    arguments: {values: "${steps.sib_lines.output}", needle: "${steps.req_sym.output}", match: contains}
              - id: found_sym
                operation: data.compare
                arguments: {left: "${steps.sym_idx.output}", right: null, operator: ne}
              - id: sib_center
                operation: data.select
                arguments: {condition: "${steps.found_sym.output}", then: "${steps.sym_idx.output}", else: 0}
              - id: sib_start_raw
                operation: data.arithmetic
                arguments: {left: "${steps.sib_center.output}", right: 20, operator: subtract}
              - id: sib_start
                operation: data.clamp
                arguments: {value: "${steps.sib_start_raw.output}", min: 0, max: "${steps.sib_count.output}"}
              - id: sib_end_raw
                operation: data.arithmetic
                arguments: {left: "${steps.sib_start.output}", right: 160, operator: add}
              - id: sib_end
                operation: data.clamp
                arguments: {value: "${steps.sib_end_raw.output}", min: 0, max: "${steps.sib_count.output}"}
              - id: sib_win
                operation: data.slice
                arguments: {values: "${steps.sib_lines.output}", start: "${steps.sib_start.output}", end: "${steps.sib_end.output}"}
              - id: sib_joined
                operation: data.join
                arguments: {values: "${steps.sib_win.output}", separator: "\n"}
              - id: sib_nonempty
                operation: data.compare
                arguments: {left: "${steps.sib_joined.output}", right: "", operator: ne}
              - id: sib_block_inner
                operation: data.select
                arguments:
                  condition: "${steps.sib_nonempty.output}"
                  then: "\n\nSibling file context (${steps.req_file.output}, lines ${steps.sib_start.output}..${steps.sib_end.output}):\n${steps.sib_joined.output}"
                  else: ""
          - id: sib_block
            operation: data.select
            arguments: {condition: "${steps.fetch_sibling.output}", then: "${steps.sib_block_inner.output}", else: ""}
          # Step 2 of triage: independently judge with primary + sibling context.
          - id: triaged
            model:
              name: ollama/hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
              bind: [triage_guide]
              prompt: |
                Scanner lead: ${steps.brief.output}

                ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                ${steps.code.output}${steps.sib_block.output}
              schema: {$ref: "#/$defs/triage_verdict"}
      - id: sibling_context
        operation: data.select
        arguments: {condition: "${steps.run_triage.output}", then: "${steps.sib_block.output}", else: ""}
      - id: should_test
        operation: data.select
        arguments:
          condition: "${steps.run_triage.output}"
          then: "${steps.triaged.output.real_bug}"
          else: true
      - id: diagnosis_text
        operation: data.select
        arguments:
          condition: "${steps.run_triage.output}"
          then: "${steps.triaged.output.diagnosis}"
          else: "${found.claim}"
      - id: target_fn_text
        operation: data.select
        arguments:
          condition: "${steps.run_triage.output}"
          then: "${steps.triaged.output.target_fn}"
          else: ""
      - id: strategy_text
        operation: data.select
        arguments:
          condition: "${steps.run_triage.output}"
          then: "${steps.triaged.output.test_strategy}"
          else: "${found.trigger}"
      - if: steps.should_test.output
        then:
          - id: not_big
            operation: data.logic
            arguments: {operator: not, left: "${steps.is_big.output}"}
          - id: use_big
            operation: data.logic
            arguments: {operator: and, left: "${steps.not_cloud.output}", right: "${steps.is_big.output}"}
          - id: use_small
            operation: data.logic
            arguments: {operator: and, left: "${steps.not_cloud.output}", right: "${steps.not_big.output}"}
          - if: steps.use_codex.output
            then:
              - id: codex
                operation: cmd.read
                arguments:
                  command: bughunt-codex
                  params:
                    prompt: |
                      We maintain this Rust project and want a regression test for a suspected defect in our own code.
                      Print only the complete contents of src/bughunt_repro.rs with no markdown fences.
                      It is a #[cfg(test)] module at the crate root: use crate:: paths and call the real function under suspicion.
                      Write one #[test] that asserts the correct, safe behaviour; when the code misbehaves the assertion must fail with a short message starting BUGHUNT-CONFIRMED (at most one BUGHUNT-CONFIRMED site; never on setup assertions; never #[should_panic]; files only under std::env::temp_dir()).

                      Diagnosis: ${steps.diagnosis_text.output}
                      Target function: ${steps.target_fn_text.output}
                      Test strategy: ${steps.strategy_text.output}
                      Suspected defect:
                      ${steps.brief.output}
          - if: steps.use_gemini.output
            then:
              - id: gemini
                operation: cmd.read
                arguments:
                  command: bughunt-gemini
                  params:
                    # agy -p takes the prompt as an argument (no stdin), so keep
                    # it on one folded line (cmd arguments forbid newlines).
                    prompt: >-
                      We maintain this Rust project and want a regression test for a suspected
                      defect in our own code. Print only the complete contents of
                      src/bughunt_repro.rs with no markdown fences. It is a #[cfg(test)] module at
                      the crate root: use crate:: paths and call the real function under suspicion.
                      Write one #[test] that asserts the correct, safe behaviour; when the code
                      misbehaves the assertion must fail with a short message starting
                      BUGHUNT-CONFIRMED (at most one BUGHUNT-CONFIRMED site; never on setup
                      assertions; never #[should_panic]; files only under std::env::temp_dir()).
                      Diagnosis: ${steps.diagnosis_text.output} Target: ${steps.target_fn_text.output}
                      Suspected defect: ${steps.brief.output}
          - if: steps.use_big.output
            then:
              - id: write_big
                model:
                  name: ollama/hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
                  bind: [harness]
                  prompt: |
                    Diagnosis: ${steps.diagnosis_text.output}
                    Target function: ${steps.target_fn_text.output}
                    Test strategy: ${steps.strategy_text.output}
                    Original lead: ${steps.brief.output}

                    ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                    ${steps.code.output}${steps.sibling_context.output}
                  schema: {$ref: "#/$defs/repro"}
          - if: steps.use_small.output
            then:
              - id: write_small
                model:
                  bind: [harness]
                  prompt: |
                    Diagnosis: ${steps.diagnosis_text.output}
                    Target function: ${steps.target_fn_text.output}
                    Test strategy: ${steps.strategy_text.output}
                    Original lead: ${steps.brief.output}

                    ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                    ${steps.code.output}${steps.sibling_context.output}
                  schema: {$ref: "#/$defs/repro"}
          - id: test_file_opt
            operation: data.coalesce
            arguments:
              values:
                - "${steps.gemini.output.stdout}"
                - "${steps.codex.output.stdout}"
                - "${steps.write_big.output.rust_source}"
                - "${steps.write_small.output.rust_source}"
          - id: has_test_file
            operation: data.compare
            arguments: {left: "${steps.test_file_opt.output}", right: null, operator: ne}
          - id: test_file
            operation: data.select
            arguments: {condition: "${steps.has_test_file.output}", then: "${steps.test_file_opt.output}", else: ""}
          - id: write
            operation: file.write_text
            arguments: {root: /absolute/path/to/target-repro, path: src/bughunt_repro.rs, text: "${steps.test_file.output}"}
          - id: run
            operation: trial.run
            arguments: {repo: bughunt-target, worktree: /absolute/path/to/target-repro}
          - id: judged
            ritual: bughunt-verdict
            arguments: {file: "${found.file}", test_file: "${steps.test_file.output}", passed: "${steps.run.output.passed}", tail: "${steps.run.output.tail}"}
          - id: build_failed
            operation: data.get
            arguments: {value: "${steps.judged.output}", path: /build_failed}
          - id: retry_gemini
            operation: data.logic
            arguments: {operator: and, left: "${steps.build_failed.output}", right: "${steps.use_gemini.output}"}
          - id: retry_codex
            operation: data.logic
            arguments: {operator: and, left: "${steps.build_failed.output}", right: "${steps.use_codex.output}"}
          - id: retry_local_big
            operation: data.logic
            arguments: {operator: and, left: "${steps.build_failed.output}", right: "${steps.use_big.output}"}
          - id: retry_local_small
            operation: data.logic
            arguments: {operator: and, left: "${steps.build_failed.output}", right: "${steps.use_small.output}"}
          - if: steps.retry_gemini.output
            then:
              - id: error_line
                operation: data.replace
                arguments: {text: "${steps.run.output.tail}", from: "\n", to: " | "}
              - id: first_try_line
                operation: data.replace
                arguments: {text: "${steps.test_file.output}", from: "\n", to: " | "}
              - id: gemini_retry
                operation: cmd.read
                arguments:
                  command: bughunt-gemini
                  params:
                    prompt: >-
                      Your previous src/bughunt_repro.rs (newlines shown as " | ") did not compile.
                      Print a corrected complete file only, no markdown fences, same rules as
                      before. Previous file: ${steps.first_try_line.output} Compiler output:
                      ${steps.error_line.output} Suspected defect: ${steps.brief.output}
          - if: steps.retry_codex.output
            then:
              - id: codex_retry
                operation: cmd.read
                arguments:
                  command: bughunt-codex
                  params:
                    prompt: |
                      Your previous src/bughunt_repro.rs did not compile.
                      Print a corrected complete file only, no markdown fences, same rules as before.

                      Previous file:
                      ${steps.test_file.output}

                      Compiler output:
                      ${steps.run.output.tail}

                      Suspected defect:
                      ${steps.brief.output}
          - if: steps.retry_local_big.output
            then:
              - id: rewrite_big
                model:
                  name: ollama/hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
                  bind: [harness]
                  prompt: |
                    Diagnosis: ${steps.diagnosis_text.output}
                    Target function: ${steps.target_fn_text.output}
                    ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                    ${steps.code.output}${steps.sibling_context.output}

                    Your previous file did not compile:
                    ${steps.test_file.output}

                    Compiler output (tail):
                    ${steps.run.output.tail}
                  schema: {$ref: "#/$defs/repro"}
          - if: steps.retry_local_small.output
            then:
              - id: rewrite_small
                model:
                  bind: [harness]
                  prompt: |
                    Diagnosis: ${steps.diagnosis_text.output}
                    Target function: ${steps.target_fn_text.output}
                    ${steps.header_block.output}Code from ${found.file}, lines from ${steps.win_start.output}:
                    ${steps.code.output}${steps.sibling_context.output}

                    Your previous file did not compile:
                    ${steps.test_file.output}

                    Compiler output (tail):
                    ${steps.run.output.tail}
                  schema: {$ref: "#/$defs/repro"}
          - id: retry_text_opt
            operation: data.coalesce
            arguments:
              values:
                - "${steps.gemini_retry.output.stdout}"
                - "${steps.codex_retry.output.stdout}"
                - "${steps.rewrite_big.output.rust_source}"
                - "${steps.rewrite_small.output.rust_source}"
          - id: has_retry_text
            operation: data.compare
            arguments: {left: "${steps.retry_text_opt.output}", right: null, operator: ne}
          - id: retry_text
            operation: data.select
            arguments: {condition: "${steps.has_retry_text.output}", then: "${steps.retry_text_opt.output}", else: ""}
          - if: steps.build_failed.output
            then:
              - id: rewrite_write
                operation: file.write_text
                arguments: {root: /absolute/path/to/target-repro, path: src/bughunt_repro.rs, text: "${steps.retry_text.output}"}
              - id: rerun
                operation: trial.run
                arguments: {repo: bughunt-target, worktree: /absolute/path/to/target-repro}
              - id: rejudged
                ritual: bughunt-verdict
                arguments: {file: "${found.file}", test_file: "${steps.retry_text.output}", passed: "${steps.rerun.output.passed}", tail: "${steps.rerun.output.tail}"}
          - id: restore
            operation: file.write_text
            arguments: {root: /absolute/path/to/target-repro, path: src/bughunt_repro.rs, text: ""}
          - id: tested_verdict
            operation: data.select
            arguments: {condition: "${steps.build_failed.output}", then: "${steps.rejudged.output.verdict}", else: "${steps.judged.output.verdict}"}
          - id: tested_file
            operation: data.select
            arguments: {condition: "${steps.build_failed.output}", then: "${steps.retry_text.output}", else: "${steps.test_file.output}"}
          - id: tested_tail
            operation: data.select
            arguments: {condition: "${steps.build_failed.output}", then: "${steps.rerun.output.tail}", else: "${steps.run.output.tail}"}
      - id: verdict
        operation: data.select
        arguments: {condition: "${steps.should_test.output}", then: "${steps.tested_verdict.output}", else: dismissed}
      - id: final_file
        operation: data.select
        arguments: {condition: "${steps.should_test.output}", then: "${steps.tested_file.output}", else: ""}
      - id: final_tail
        operation: data.select
        arguments: {condition: "${steps.should_test.output}", then: "${steps.tested_tail.output}", else: ""}
      - id: result
        operation: data.merge
        arguments:
          left: "${found}"
          right:
            verdict: "${steps.verdict.output}"
            diagnosis: "${steps.diagnosis_text.output}"
            test_file: "${steps.final_file.output}"
            tail: "${steps.final_tail.output}"
  - id: finished
    operation: data.filter
    arguments: {values: "${steps.per_finding.output}", predicate: 'item.status == "returned"'}
  - id: results
    operation: data.map
    arguments:
      values: "${steps.finished.output}"
      operation: data.get
      arguments: {value: "${item}", path: /outputs/result}
  - id: confirmed
    operation: data.filter
    arguments: {values: "${steps.results.output}", predicate: 'item.verdict == "confirmed"'}
  - id: confirmed_count
    operation: data.count
    arguments: {value: "${steps.confirmed.output}"}
  - id: dismissed
    operation: data.filter
    arguments: {values: "${steps.results.output}", predicate: 'item.verdict == "dismissed"'}
  - id: dismissed_count
    operation: data.count
    arguments: {value: "${steps.dismissed.output}"}
finally:
  # Always remove the throwaway worktree and branch if add succeeded, even when
  # the main steps fail, exhaust, or are cancelled.
  - if: steps.add.status == "returned"
    then:
      - id: clean
        operation: file.write_text
        arguments: {root: /absolute/path/to/target-repro, path: src/bughunt_repro.rs, text: ""}
      - id: remove
        operation: git.remove_worktree
        arguments: {repo: bughunt-target, path: /absolute/path/to/target-repro}
        fallback:
          - id: remove_skipped
            operation: data.select
            arguments: {condition: true, then: "worktree left in place; see README", else: ""}
      - id: drop_branch
        operation: git.delete_branch
        arguments: {repo: bughunt-target, branch: repro}
        fallback:
          - id: drop_skipped
            operation: data.select
            arguments: {condition: true, then: "branch left in place; see README", else: ""}
return:
  results: "${steps.results.output}"
  confirmed: "${steps.confirmed_count.output}"
  dismissed: "${steps.dismissed_count.output}"
  tested: "${steps.per_finding.counts}"
  untested: "${steps.untested.output}"
