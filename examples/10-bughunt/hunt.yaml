language_version: 1
ritual: bughunt-hunt
description: >-
  Recursively walk source files beneath one or more directories using file.walk,
  deduplicate overlapping paths across dirs, scan each file chunk by chunk, and
  ask a small model for bugs or ways around the system from one angle. Read-only.
inputs:
  root: {type: string, default: /absolute/path/to/target}
  dirs: {type: list, default: [src]}
  angle: string
  ext: {type: string, default: ".rs"}
  chunk: {type: integer, default: 150, min: 1, max: 2000}
requires:
  - {reagent: file, action: walk, on: {root: "${inputs.root}"}}
  - {reagent: file, action: read_text, on: {root: "${inputs.root}"}}
essence: {requests: 400, time: 3h}
steps:
  - id: walked
    each: dir in inputs.dirs
    keep: [paths]
    steps:
      - id: listing
        operation: file.walk
        arguments: {root: "${inputs.root}", path: "${dir}", ext: "${inputs.ext}"}
      - id: paths
        operation: data.get
        arguments: {value: "${steps.listing.output}", path: /paths}
  - id: path_lists
    operation: data.map
    arguments:
      values: "${steps.walked.output}"
      operation: data.get
      arguments: {value: "${item}", path: /outputs/paths}
  - id: all_paths
    operation: data.flatten
    arguments: {values: "${steps.path_lists.output}"}
  - id: unique_paths
    operation: data.unique
    arguments: {values: "${steps.all_paths.output}"}
  # An unreadable file (not UTF-8, over 1 MiB) is skipped, not fatal.
  - id: per_file
    each: file_path in steps.unique_paths.output
    on_failure: continue
    keep: [scanned]
    steps:
      - id: scanned
        ritual: bughunt-scan-file
        arguments: {root: "${inputs.root}", path: "${file_path}", angle: "${inputs.angle}", chunk: "${inputs.chunk}"}
  - id: files_ok
    operation: data.filter
    arguments: {values: "${steps.per_file.output}", predicate: 'item.status == "returned"'}
  - id: file_lists
    operation: data.map
    arguments:
      values: "${steps.files_ok.output}"
      operation: data.get
      arguments: {value: "${item}", path: /outputs/scanned/findings}
  - id: all_findings
    operation: data.flatten
    arguments: {values: "${steps.file_lists.output}"}
  - id: file_fail_counts
    operation: data.map
    arguments:
      values: "${steps.files_ok.output}"
      operation: data.get
      arguments: {value: "${item}", path: /outputs/scanned/chunks_failed}
  - id: chunks_failed
    operation: data.sum_integers
    arguments: {values: "${steps.file_fail_counts.output}"}
  - id: files_failed_list
    operation: data.filter
    arguments: {values: "${steps.per_file.output}", predicate: 'item.status != "returned"'}
  - id: files_failed
    operation: data.count
    arguments: {value: "${steps.files_failed_list.output}"}
  - id: files_wanted
    operation: data.count
    arguments: {value: "${steps.unique_paths.output}"}
  - id: some_wanted
    operation: data.compare
    arguments: {left: "${steps.files_wanted.output}", right: 0, operator: gt}
  - id: every_file_failed
    operation: data.compare
    arguments: {left: "${steps.files_failed.output}", right: "${steps.files_wanted.output}", operator: eq}
  - id: dead
    operation: data.logic
    arguments: {operator: and, left: "${steps.some_wanted.output}", right: "${steps.every_file_failed.output}"}
  - id: alive
    operation: data.logic
    arguments: {operator: not, left: "${steps.dead.output}"}
  - id: some_file_scanned
    operation: data.assert
    arguments: {condition: "${steps.alive.output}", message: "every source file failed to scan; is the model or backend available?"}
return:
  angle: "${inputs.angle}"
  findings: "${steps.all_findings.output}"
  files_failed: "${steps.files_failed.output}"
  chunks_failed: "${steps.chunks_failed.output}"
