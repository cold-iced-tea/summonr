# Drill for bughunt-verdict: turns a repro test and its trial result into a
# verdict. Pure.
drill: bughunt-verdict-cases
ritual: bughunt-verdict
cases:
  - id: marker-panic-confirms
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::allowed;\n#[test] fn t() { assert!(!allowed(\"adminx\"), \"BUGHUNT-CONFIRMED: prefix\"); }"
      passed: false
      tail: "error: test failed\n--- stdout ---\nthread 'bughunt_repro::t' panicked at src/bughunt_repro.rs:9:5:\nBUGHUNT-CONFIRMED: role passes\n\ntest result: FAILED. 0 passed; 1 failed; 0 ignored"
    expect: {outcome: returned, result: {verdict: confirmed, build_failed: false}, model_calls: 0}
  - id: passing-test-refutes
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::allowed;\n#[test] fn t() { assert!(allowed(\"admin\")); }"
      passed: true
      tail: "--- stdout ---\nrunning 1 test\n.\ntest result: ok. 1 passed; 0 failed; 0 ignored"
    expect: {outcome: returned, result: {verdict: refuted}}
  - id: compile-error-quoting-marker-is-untestable
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::nope;"
      passed: false
      tail: "error[E0425]: cannot find function `nope`\n  |     panic!(\"BUGHUNT-CONFIRMED\")\nerror: could not compile `summonr` (bin \"summonr\" test) due to 1 previous error"
    expect: {outcome: returned, result: {verdict: untestable, build_failed: true}}
  - id: syntax-error-without-code-is-a-build-failure
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::x;\\n"
      passed: false
      tail: "error: unknown start of token: \\\nerror: could not compile `summonr` (bin \"summonr\" test) due to 1 previous error"
    expect: {outcome: returned, result: {verdict: untestable, build_failed: true}}
  - id: a-test-that-ran-is-not-a-build-failure
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::x;"
      passed: false
      tail: "--- stdout ---\nprinted error[E0001] in a message\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {build_failed: false}}
  - id: other-panic-is-untestable
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::x;"
      passed: false
      tail: "--- stdout ---\nthread 'bughunt_repro::t' panicked at src/bughunt_repro.rs:4:9:\ncalled `Option::unwrap()` on a `None` value\n\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: untestable}}
  - id: no-test-ran-is-untestable
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::x;"
      passed: true
      tail: "--- stdout ---\nrunning 0 tests\n\ntest result: ok. 0 passed; 0 failed; 0 ignored"
    expect: {outcome: returned, result: {verdict: untestable}}
  - id: test-that-never-calls-the-code-cannot-confirm
    inputs:
      file: src/auth.rs
      test_file: "#[test] fn t() { let bad = true; assert!(!bad, \"BUGHUNT-CONFIRMED: copied logic\"); }"
      passed: false
      tail: "panicked at src/bughunt_repro.rs:9:5:\nBUGHUNT-CONFIRMED: copied logic\n\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: untestable}}
  - id: should-panic-cannot-refute
    inputs:
      file: src/auth.rs
      test_file: "use crate::auth::allowed;\n#[test] #[should_panic] fn t() { allowed(\"\"); }"
      passed: true
      tail: "running 1 test\n.\ntest result: ok. 1 passed; 0 failed"
    expect: {outcome: returned, result: {verdict: untestable}}
  - id: mod-rs-is-named-by-its-directory
    inputs:
      file: src/cli/mod.rs
      test_file: "use crate::cli::run;\n#[test] fn t() { assert!(false, \"BUGHUNT-CONFIRMED: x\"); }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: x\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: confirmed}}
  - id: main-rs-is-the-crate-root
    inputs:
      file: src/main.rs
      test_file: "use crate::parse_args;\n#[test] fn t() { assert!(false, \"BUGHUNT-CONFIRMED: x\"); }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: x\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: confirmed}}
  - id: re-exported-module-path-counts
    inputs:
      file: src/reagents/git_reagent.rs
      test_file: "use crate::git_reagent::valid_ref_name;\n#[test] fn t() { assert!(valid_ref_name(\"a..b\").is_err(), \"BUGHUNT-CONFIRMED: x\"); }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: x\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: confirmed}}
  - id: reagent-dispatcher-call-counts-as-honest
    inputs:
      file: src/reagents/file_reagent.rs
      test_file: "use crate::reagent;\n#[test] fn t() { let _ = reagent::call(None, \"file\", \"write_text\", &v, &a); }"
      passed: true
      tail: "running 1 test\n.\ntest result: ok. 1 passed; 0 failed"
    expect: {outcome: returned, result: {verdict: refuted, honest: true}}
  - id: reagent-dispatcher-authorize-counts-as-honest
    inputs:
      file: src/reagents/http_reagent.rs
      test_file: "use crate::reagent;\n#[test] fn t() { assert!(reagent::authorize(None, \"http.post\", &v, &a).is_err(), \"BUGHUNT-CONFIRMED: crlf\"); }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: crlf\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: confirmed, honest: true}}
  - id: both-branches-marker-cheat-is-untestable
    inputs:
      file: src/ritual.rs
      test_file: "use crate::ritual::Ritual;\n#[test] fn t() { if ok { panic!(\"BUGHUNT-CONFIRMED: a\"); } else { assert!(false, \"BUGHUNT-CONFIRMED: b\"); } }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: a\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: untestable, honest: false}}
  - id: setup-deserialization-marker-is-untestable
    inputs:
      file: src/ritual.rs
      test_file: "use crate::ritual::Ritual;\n#[test] fn t() { assert!(r.is_ok(), \"BUGHUNT-CONFIRMED: Failed to deserialize ritual\"); }"
      passed: false
      tail: "BUGHUNT-CONFIRMED: Failed to deserialize ritual\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: untestable, honest: false}}
  - id: comment-quoting-marker-does-not-break-honesty
    inputs:
      file: src/reagent.rs
      test_file: "use crate::reagent::validate_grant_scope;\n#[test] fn t() {\n    // Prompt says: panic with BUGHUNT-CONFIRMED when the bug happens\n    assert!(validate_grant_scope(\"x\", &on, &into).is_err(), \"BUGHUNT-CONFIRMED: bypass\");\n}"
      passed: false
      tail: "BUGHUNT-CONFIRMED: bypass\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: confirmed, honest: true}}
  - id: inverted-catch-unwind-assertion-is-untestable
    inputs:
      file: src/io.rs
      test_file: "use crate::io::Replay;\n#[test] fn t() {\n    let result = std::panic::catch_unwind(|| Replay::new(c));\n    assert!(result.is_err(), \"BUGHUNT-CONFIRMED: panicked\");\n}"
      passed: false
      tail: "BUGHUNT-CONFIRMED: panicked\ntest result: FAILED. 0 passed; 1 failed"
    expect: {outcome: returned, result: {verdict: untestable, honest: false}}
  # lang: python reads a unittest run of test_bughunt_repro.py.
  - id: python-marker-failure-confirms
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        self.assertFalse(allowed(\"adminx\"), \"BUGHUNT-CONFIRMED: prefix\")\n"
      passed: false
      tail: "F\n======================================================================\nFAIL: test_repro (test_bughunt_repro.Repro.test_repro)\nAssertionError: True is not false : BUGHUNT-CONFIRMED: prefix\n\n----------------------------------------------------------------------\nRan 1 test in 0.001s\n\nFAILED (failures=1)"
    expect: {outcome: returned, result: {verdict: confirmed, build_failed: false, honest: true}, model_calls: 0}
  - id: python-one-test-ok-refutes
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        self.assertTrue(allowed(\"admin\"))\n"
      passed: true
      tail: ".\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nOK"
    expect: {outcome: returned, result: {verdict: refuted, build_failed: false}}
  - id: python-no-tests-ran-is-untestable
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n"
      passed: false
      tail: "\n----------------------------------------------------------------------\nRan 0 tests in 0.000s\n\nNO TESTS RAN"
    expect: {outcome: returned, result: {verdict: untestable, build_failed: false}}
  - id: python-import-error-is-a-build-failure
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import nope\n"
      passed: false
      tail: "E\n======================================================================\nERROR: test_bughunt_repro (unittest.loader._FailedTest.test_bughunt_repro)\nImportError: cannot import name 'nope' from 'pkg.auth'\n\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nFAILED (errors=1)"
    expect: {outcome: returned, result: {verdict: untestable, build_failed: true}}
  - id: python-marker-in-an-uncaught-error-is-untestable
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        raise ValueError(\"BUGHUNT-CONFIRMED: wrong kind\")\n"
      passed: false
      tail: "E\n======================================================================\nERROR: test_repro (test_bughunt_repro.Repro.test_repro)\nValueError: BUGHUNT-CONFIRMED: wrong kind\n\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nFAILED (errors=1)"
    expect: {outcome: returned, result: {verdict: untestable, build_failed: false}}
  - id: python-test-that-never-imports-the-module-cannot-confirm
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        # copied from pkg/auth.py\n        bad = \"adminx\".startswith(\"admin\")\n        self.assertFalse(bad, \"BUGHUNT-CONFIRMED: copied logic\")\n"
      passed: false
      tail: "AssertionError: True is not false : BUGHUNT-CONFIRMED: copied logic\n\nRan 1 test in 0.000s\n\nFAILED (failures=1)"
    expect: {outcome: returned, result: {verdict: untestable, honest: false}}
  - id: python-expected-failure-cannot-refute
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n\nclass Repro(unittest.TestCase):\n    @unittest.expectedFailure\n    def test_repro(self):\n        self.assertFalse(allowed(\"adminx\"))\n"
      passed: true
      tail: "x\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nOK (expected failures=1)"
    expect: {outcome: returned, result: {verdict: untestable, honest: false}}
  - id: python-package-import-reaches-a-private-module
    inputs:
      lang: python
      file: src/packaging/_parser.py
      test_file: "import unittest\nfrom packaging.markers import Marker, InvalidMarker\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        try:\n            Marker(\"(\" * 5000 + 'python_version > \"1\"' + \")\" * 5000)\n            kind = None\n        except InvalidMarker:\n            kind = \"invalid\"\n        except RecursionError:\n            kind = \"recursion\"\n        self.assertNotEqual(kind, \"recursion\", \"BUGHUNT-CONFIRMED: RecursionError\")\n"
      passed: false
      tail: "AssertionError: 'recursion' == 'recursion' : BUGHUNT-CONFIRMED: RecursionError\n\n----------------------------------------------------------------------\nRan 1 test in 0.004s\n\nFAILED (failures=1)"
    expect: {outcome: returned, result: {verdict: confirmed, honest: true}}
  - id: python-init-is-named-by-its-package
    inputs:
      lang: python
      file: src/tomli/__init__.py
      test_file: "import unittest\nimport tomli\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        self.assertEqual(tomli.loads(\"a = 1\"), {\"a\": 1})\n"
      passed: true
      tail: ".\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nOK"
    expect: {outcome: returned, result: {verdict: refuted, honest: true}}
  - id: python-hash-comment-quoting-marker-does-not-break-honesty
    inputs:
      lang: python
      file: pkg/auth.py
      test_file: "import unittest\nfrom pkg.auth import allowed\n\nclass Repro(unittest.TestCase):\n    def test_repro(self):\n        # fail with BUGHUNT-CONFIRMED only when the bug happens\n        self.assertFalse(allowed(\"adminx\"), \"BUGHUNT-CONFIRMED: prefix\")\n"
      passed: false
      tail: "AssertionError: True is not false : BUGHUNT-CONFIRMED: prefix\n\nRan 1 test in 0.000s\n\nFAILED (failures=1)"
    expect: {outcome: returned, result: {verdict: confirmed, honest: true}}
