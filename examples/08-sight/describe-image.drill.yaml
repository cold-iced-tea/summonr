# Drill for describe-image: the model's caption is scripted, so no vision model
# is needed. The image is still read for real, so the ritual's root must be
# rewritten to your checkout and granted. From the repository root:
#   sed "s|/absolute/path/to/summonr|$PWD|g" examples/08-sight/describe-image.yaml > "$SUMMONR_HOME/describe-image.yaml"
#   summonr inscribe "$SUMMONR_HOME/describe-image.yaml"
#   summonr allow describe-image --from sight --select read_image --on root="$PWD/examples/08-sight/fixtures"
#   summonr drill describe-image against examples/08-sight/describe-image.drill.yaml
drill: describe-image-cases
ritual: describe-image
cases:
  - id: tiny-png-is-captioned
    inputs: {path: dot.png}
    model: {described: [{caption: A single teal pixel}]}
    expect:
      outcome: returned
      result: {width: 1, height: 1, mime: image/png, caption: A single teal pixel}
      model_calls: 1
