# Drill for describe-image: the model's caption is scripted, so no vision model
# is needed. The image is still read for real, from the root passed with --arg.
# From the repository root:
#   summonr inscribe examples/08-sight/describe-image.yaml
#   summonr allow describe-image --from sight --select read_image --under "$PWD/examples/08-sight"
#   summonr drill describe-image against examples/08-sight/describe-image.drill.yaml --arg root="$PWD/examples/08-sight/fixtures"
drill: describe-image-cases
ritual: describe-image
cases:
  - id: tiny-png-is-captioned
    inputs: {path: dot.png}
    model: {described: [{caption: A single teal pixel}]}
    expect:
      outcome: returned
      result: {width: 1, height: 1, mime: image/png, caption: A single teal pixel}
      model_calls: 1
