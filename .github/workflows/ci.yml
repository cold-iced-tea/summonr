name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: Offline integration & book links
        run: python3 -B scripts/check_offline.py
      - name: Shared jobs check
        run: python3 -B scripts/check_jobs.py
      - name: Standard library check
        run: python3 -B scripts/check_stdlib.py
      - name: Reliquary check
        run: python3 -B scripts/check_reliquary.py
      - name: Rites check
        run: python3 -B scripts/check_rites.py
      - name: Python SDK unit tests
        env:
          PYTHONPATH: sdk/python
        run: python3 -B -m unittest discover -s sdk/python/tests
